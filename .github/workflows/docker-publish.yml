name: Publish Docker Hub image

on:
  workflow_call:
    inputs:
      tag:
        description: Existing release tag (vMAJOR.MINOR.PATCH)
        required: true
        type: string
    secrets:
      DOCKERHUB_TOKEN:
        required: true
    outputs:
      image:
        value: ${{ jobs.publish.outputs.image }}
      revision:
        value: ${{ jobs.publish.outputs.revision }}
      latest:
        value: ${{ jobs.publish.outputs.latest }}
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (vMAJOR.MINOR.PATCH)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: docker-hub-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      image: ${{ steps.metadata.outputs.image }}
      revision: ${{ steps.metadata.outputs.revision }}
      latest: ${{ steps.metadata.outputs.latest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate tag and source versions
        id: metadata
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python3 tools/release_metadata.py --tag "$RELEASE_TAG" --github-output "$GITHUB_OUTPUT"
          python3 tools/public_release.py
          python3 tools/verify_python_lock.py

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build release image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.metadata.outputs.image }}
          build-args: VCS_REF=${{ steps.metadata.outputs.revision }}
          cache-from: type=gha,scope=release-image
          cache-to: type=gha,scope=release-image,mode=max
          provenance: false

      - name: Verify image identity and runtime dependencies
        env:
          IMAGE: ${{ steps.metadata.outputs.image }}
        run: python3 tools/release_image.py --verify-only "$IMAGE"

      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: drdon1234
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish verified version
        env:
          IMAGE: ${{ steps.metadata.outputs.image }}
        run: docker push "$IMAGE"

      - name: Update latest for the newest version only
        if: steps.metadata.outputs.latest == 'true'
        env:
          IMAGE: ${{ steps.metadata.outputs.image }}
        run: |
          docker tag "$IMAGE" drdon1234/jav-pilot:latest
          docker push drdon1234/jav-pilot:latest

      - name: Write summary
        env:
          IMAGE: ${{ steps.metadata.outputs.image }}
          REVISION: ${{ steps.metadata.outputs.revision }}
        run: |
          printf 'Published `%s` from commit `%s`.\n' "$IMAGE" "$REVISION" >> "$GITHUB_STEP_SUMMARY"
